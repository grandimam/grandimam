<svg width="800" height="380" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes typewriter1 {
      0%, 5% { opacity: 0; }
      6%, 100% { opacity: 1; }
    }

    @keyframes typewriter2 {
      0%, 15% { opacity: 0; }
      16%, 100% { opacity: 1; }
    }

    @keyframes typewriter3 {
      0%, 30% { opacity: 0; }
      31%, 100% { opacity: 1; }
    }

    @keyframes typewriter4 {
      0%, 45% { opacity: 0; }
      46%, 100% { opacity: 1; }
    }

    @keyframes typewriter5 {
      0%, 60% { opacity: 0; }
      61%, 100% { opacity: 1; }
    }

    @keyframes typewriter6 {
      0%, 75% { opacity: 0; }
      76%, 100% { opacity: 1; }
    }

    @keyframes fadeIn {
      0%, 90% { opacity: 0; }
      100% { opacity: 1; }
    }

    .terminal { fill: #0d1117; }
    .terminal-header { fill: #161b22; }
    .text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Monaco', 'Menlo', monospace;
      font-size: 13px;
      fill: #c9d1d9;
    }
    .prompt { fill: #7ee787; }
    .command { fill: #79c0ff; }
    .path { fill: #a5d6ff; }
    .output { fill: #c9d1d9; }
    .highlight { fill: #ffa657; }
    .comment { fill: #8b949e; }
    .string { fill: #a5d6ff; }
    .number { fill: #79c0ff; }
    .success { fill: #7ee787; }
    .error { fill: #f85149; }

    .cursor {
      animation: blink 1s step-end infinite;
      fill: #c9d1d9;
    }

    .line1 { animation: typewriter1 3s ease-out forwards; }
    .line2 { animation: typewriter2 3s ease-out forwards; }
    .line3 { animation: typewriter3 3s ease-out forwards; }
    .line4 { animation: typewriter4 3s ease-out forwards; }
    .line5 { animation: typewriter5 3s ease-out forwards; }
    .line6 { animation: typewriter6 3s ease-out forwards; }
    .fade { animation: fadeIn 3s ease-out forwards; }

    .btn { r: 6; }
    .btn-close { fill: #f85149; }
    .btn-min { fill: #f0883e; }
    .btn-max { fill: #7ee787; }

    .tab { fill: #0d1117; }
    .tab-active { fill: #161b22; }
    .tab-text { font-size: 11px; fill: #8b949e; }
    .tab-text-active { fill: #c9d1d9; }
  </style>

  <!-- Terminal window -->
  <rect class="terminal" x="0" y="0" width="800" height="380" rx="10"/>

  <!-- Title bar -->
  <rect class="terminal-header" x="0" y="0" width="800" height="36" rx="10"/>
  <rect class="terminal" x="0" y="26" width="800" height="15"/>

  <!-- Window buttons -->
  <circle class="btn btn-close" cx="20" cy="18"/>
  <circle class="btn btn-min" cx="40" cy="18"/>
  <circle class="btn btn-max" cx="60" cy="18"/>

  <!-- Tabs -->
  <rect class="tab-active" x="80" y="8" width="120" height="28" rx="6"/>
  <text x="140" y="26" text-anchor="middle" class="text tab-text-active">grandimam</text>

  <rect class="tab" x="205" y="8" width="80" height="28" rx="6"/>
  <text x="245" y="26" text-anchor="middle" class="text tab-text">barq</text>

  <!-- Terminal content -->
  <g transform="translate(20, 56)">

    <!-- Command 1: neofetch style intro -->
    <g class="line1">
      <text class="text">
        <tspan class="prompt">❯</tspan>
        <tspan class="command"> neofetch</tspan>
      </text>
    </g>

    <!-- ASCII art + info block -->
    <g class="line2" transform="translate(0, 28)">
      <text class="text comment">
        <tspan x="0" dy="0">    ╭──────────────────────╮</tspan>
        <tspan x="0" dy="18">    │</tspan>
        <tspan class="success">  hamza@github  </tspan>
        <tspan class="comment">│</tspan>
        <tspan x="240" dy="0" class="output">OS:</tspan>
        <tspan class="string"> Python 3.13t (free-threaded)</tspan>

        <tspan x="0" dy="18">    │</tspan>
        <tspan class="highlight">   ⚡ barq dev   </tspan>
        <tspan class="comment">│</tspan>
        <tspan x="240" dy="0" class="output">Shell:</tspan>
        <tspan class="string"> systems-minded</tspan>

        <tspan x="0" dy="18">    ╰──────────────────────╯</tspan>
        <tspan x="240" dy="0" class="output">Editor:</tspan>
        <tspan class="string"> less is more</tspan>
      </text>
    </g>

    <!-- Command 2: current work -->
    <g class="line3" transform="translate(0, 120)">
      <text class="text">
        <tspan class="prompt">❯</tspan>
        <tspan class="command"> cat</tspan>
        <tspan class="path"> ~/now.md</tspan>
      </text>
    </g>

    <g class="line4" transform="translate(0, 142)">
      <text class="text output">
        <tspan x="0" dy="0">Building </tspan>
        <tspan class="highlight">barq</tspan>
        <tspan> — HTTP framework for free-threaded Python</tspan>
        <tspan x="0" dy="18" class="comment"># 2-5x faster than FastAPI, 621 lines, pure Python</tspan>
      </text>
    </g>

    <!-- Command 3: philosophy -->
    <g class="line5" transform="translate(0, 190)">
      <text class="text">
        <tspan class="prompt">❯</tspan>
        <tspan class="command"> echo</tspan>
        <tspan class="string"> "$PHILOSOPHY"</tspan>
      </text>
    </g>

    <g class="line6" transform="translate(0, 212)">
      <text class="text output">
        <tspan x="0" dy="0">Delete more than you add. Flat over nested. Pure Python.</tspan>
      </text>
    </g>

    <!-- Command 4: stats (real data placeholder) -->
    <g class="fade" transform="translate(0, 245)">
      <text class="text">
        <tspan class="prompt">❯</tspan>
        <tspan class="command"> git</tspan>
        <tspan class="path"> stats</tspan>
      </text>
      <text y="22" class="text">
        <tspan class="success">+4,161</tspan>
        <tspan class="comment"> lines added</tspan>
        <tspan dx="20" class="error">-199</tspan>
        <tspan class="comment"> deleted</tspan>
        <tspan dx="20" class="number">10</tspan>
        <tspan class="comment"> commits</tspan>
        <tspan dx="20" class="comment">(barq)</tspan>
      </text>
    </g>

    <!-- Cursor -->
    <g class="fade" transform="translate(0, 290)">
      <text class="text">
        <tspan class="prompt">❯</tspan>
        <tspan class="cursor"> █</tspan>
      </text>
    </g>

  </g>
</svg>
