<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  {% seo %}

  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/gi-logo.svg' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="shell">
    <header class="site-header">
      {% include profile.html %}
      {% include navigation.html %}
    </header>
    <div class="main-column">
      <main class="content" id="main-content">
        {{ content }}
      </main>
      <footer class="content-footer">
        <div>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</div>
        <div class="footer-links">
          <a class="footer-link" href="{{ '/framework/' | relative_url }}">Framework</a>
          <a class="footer-link" href="https://github.com/{{ site.social.github }}">GitHub</a>
          <a class="footer-link" href="https://twitter.com/{{ site.social.twitter }}">X</a>
          <a class="footer-link" href="{{ '/feed.xml' | relative_url }}">RSS</a>
        </div>
      </footer>
    </div>
  </div>
  {% if page.layout == 'post' %}<script src="{{ '/assets/js/post.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>{% endif %}
</body>
</html>
