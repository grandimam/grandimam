<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <meta name="keywords" content="{{ site.keywords | join: ', ' }}">
  <meta name="author" content="{{ site.author.name }}">

  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:type" content="website">

  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.baseurl }}/feed.xml">
  <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/assets/images/gi-logo.svg">
  <link rel="shortcut icon" href="{{ site.baseurl }}/assets/images/gi-logo.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --text: #18202f;
      --text-soft: #556070;
      --text-mute: #95a0b1;
      --line: rgba(24, 32, 47, 0.08);
      --accent: #2ea85f;
      --accent-soft: rgba(46, 168, 95, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(1040px, calc(100% - 64px));
      margin: 0 auto;
      padding: 40px 0 36px;
      display: grid;
      grid-template-columns: 170px minmax(0, 1fr);
      gap: 40px;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-height: calc(100vh - 76px);
      position: sticky;
      top: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      color: var(--text);
      transition: opacity 0.18s ease;
    }

    .brand-mark {
      display: block;
      width: 28px;
      height: 28px;
      border-radius: 7px;
    }

    .brand:hover,
    .sidebar-link:hover,
    .footer-link:hover,
    .row-link:hover,
    .inline-link:hover {
      opacity: 0.88;
    }

    .site-nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sidebar-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      font-weight: 400;
      color: var(--text-soft);
      transition: color 0.18s ease;
    }

    .sidebar-link::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: transparent;
      transition: background-color 0.18s ease, box-shadow 0.18s ease;
    }

    .sidebar-link.active {
      color: var(--accent);
    }

    .sidebar-link.active::before {
      background: var(--accent);
      box-shadow: 0 0 0 6px var(--accent-soft);
    }

    .sidebar-copy {
      max-width: 16ch;
      font-size: 11px;
      line-height: 1.6;
      color: var(--text-mute);
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .footer-link {
      color: var(--text-mute);
      transition: color 0.18s ease;
    }

    .content {
      min-width: 0;
      padding-top: 2px;
      max-width: 820px;
    }

    .nameplate {
      margin-bottom: 44px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text);
    }

    .masthead {
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin-bottom: 8px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-mute);
    }

    .title {
      max-width: 14ch;
      font-size: clamp(1.05rem, 1.35vw, 1.35rem);
      line-height: 1.16;
      letter-spacing: -0.02em;
      font-weight: 600;
      text-wrap: balance;
    }

    .subtitle {
      max-width: 30rem;
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-soft);
      font-family: "Source Serif 4", serif;
    }

    .row-list {
      list-style: none;
    }

    .row-link {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: baseline;
      padding: 16px 0;
      transition: background-color 0.18s ease, color 0.18s ease;
    }

    .row-link:hover {
      background: transparent;
    }

    .row-title {
      font-size: clamp(0.92rem, 1vw, 0.98rem);
      line-height: 1.35;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }

    .row-meta {
      font-size: 11px;
      font-weight: 400;
      line-height: 1.4;
      color: var(--text-mute);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .prose {
      max-width: 37rem;
      font-family: "Source Serif 4", serif;
      font-size: clamp(1.02rem, 1.05vw, 1.1rem);
      line-height: 1.8;
      color: var(--text-soft);
    }

    .prose p + p {
      margin-top: 1.35em;
    }

    .prose strong {
      color: var(--text);
      font-weight: 600;
    }

    .inline-link {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-color: rgba(46, 168, 95, 0.35);
      text-underline-offset: 0.12em;
      text-decoration-thickness: 1px;
      transition: color 0.18s ease, text-decoration-color 0.18s ease;
    }

    .meta-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin-top: 18px;
      font-size: 14px;
      color: var(--text-mute);
      font-variant-numeric: tabular-nums;
    }

    .empty {
      padding: 18px 0;
      color: var(--text-soft);
      font-size: 14px;
    }

    .content-footer {
      margin-top: 56px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      align-items: center;
      font-size: 11px;
      color: var(--text-mute);
    }

    @media (max-width: 1024px) {
      .shell {
        width: min(100% - 32px, 860px);
        grid-template-columns: 1fr;
        gap: 24px;
        padding-top: 24px;
      }

      .sidebar {
        min-height: auto;
        position: static;
        gap: 14px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }

      .content {
        max-width: none;
      }
    }

    @media (max-width: 720px) {
      .shell {
        width: min(100% - 24px, 860px);
      }

      .row-link {
        grid-template-columns: 1fr;
        gap: 6px;
        padding: 14px 0;
      }

      .title {
        max-width: none;
      }

      .prose {
        font-size: 1.14rem;
      }
    }
  </style>
</head>
<body>
  {{ content }}
</body>
</html>
