<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- SEO Meta Tags -->
  <meta name="keywords" content="{{ site.keywords | join: ', ' }}">
  <meta name="author" content="{{ site.author.name }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:type" content="website">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.baseurl }}/feed.xml">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ site.baseurl }}/favicon.png">

  <!-- JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #111;
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 80px 24px;
    }

    a {
      color: #111;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    a:hover {
      opacity: 0.6;
    }

    .header {
      margin-bottom: 64px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .header h1 a:hover {
      opacity: 1;
    }

    .header p {
      font-size: 15px;
      color: #666;
    }

    .year {
      font-size: 14px;
      font-weight: 600;
      color: #111;
      margin-top: 40px;
      margin-bottom: 16px;
    }

    .year:first-of-type {
      margin-top: 0;
    }

    .post-item {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 8px 0;
    }

    .post-date {
      font-size: 14px;
      color: #999;
      flex-shrink: 0;
      width: 52px;
    }

    .post-title {
      font-size: 15px;
      color: #111;
      flex: 1;
    }

    .post-reading-time {
      font-size: 13px;
      color: #bbb;
      flex-shrink: 0;
    }

    .footer {
      margin-top: 80px;
      padding-top: 32px;
      border-top: 1px solid #eee;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 16px;
    }

    .footer-links a {
      font-size: 14px;
      color: #666;
    }

    .footer-links a:hover {
      color: #111;
      opacity: 1;
    }

    code {
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      background: #f6f8fa;
      padding: 2px 6px;
      border-radius: 4px;
      color: #24292e;
    }

    pre {
      font-family: "JetBrains Mono", monospace;
      background: #f6f8fa;
      border: 1px solid #e1e4e8;
      padding: 16px 20px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 24px 0;
      font-size: 14px;
      line-height: 1.6;
    }

    pre code {
      background: none;
      padding: 0;
      border: none;
    }

    @media (max-width: 480px) {
      .container {
        padding: 48px 20px;
      }

      .header {
        margin-bottom: 48px;
      }

      .post-item {
        flex-wrap: wrap;
        gap: 4px 16px;
        padding: 12px 0;
      }

      .post-reading-time {
        width: 100%;
        margin-left: 68px;
        margin-top: -4px;
      }

      .footer {
        margin-top: 48px;
      }

      .footer-links {
        gap: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    {{ content }}
  </div>
</body>
</html>
