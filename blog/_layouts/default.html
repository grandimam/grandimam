<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- SEO Meta Tags -->
  <meta name="keywords" content="{{ site.keywords | join: ', ' }}">
  <meta name="author" content="{{ site.author.name }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:type" content="website">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.baseurl }}/feed.xml">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ site.baseurl }}/favicon.png">

  <!-- JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f6f6f6;
      --text: #1a1a1a;
      --text-soft: #5a5a5a;
      --text-mute: #8a8a8a;
      --border: #ececec;
      --link: #1a1a1a;
      --code-bg: #f6f6f6;
      --code-border: #e4e4e4;
      --code-text: #24292e;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0d;
        --bg-soft: #161616;
        --text: #d4d4d4;
        --text-soft: #a0a0a0;
        --text-mute: #707070;
        --border: #1f1f1f;
        --link: #d4d4d4;
        --code-bg: #161616;
        --code-border: #242424;
        --code-text: #d4d4d4;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0.05);
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 24px;
      -webkit-text-size-adjust: 100%;
      -moz-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 16px;
      line-height: 1.7;
      letter-spacing: -0.003em;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 660px;
      margin: 0 auto;
      padding: 88px 24px;
    }

    a {
      color: var(--link);
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    a:hover {
      opacity: 0.55;
    }

    .header {
      margin-bottom: 64px;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
      text-wrap: balance;
    }

    .header h1 a:hover {
      opacity: 1;
    }

    .header h1 a .cursor {
      display: inline-block;
      width: 10px;
      height: 1.2em;
      background-color: var(--text);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0;
      }
    }

    .header .tagline {
      font-size: 14px;
      color: var(--text-soft);
      margin-bottom: 20px;
      text-wrap: balance;
    }

    /* Topic pills */
    .topics {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .topic {
      display: inline-block;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.01em;
      color: var(--text-soft);
      background: var(--bg-soft);
      padding: 4px 10px;
      border-radius: 999px;
      text-decoration: none;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .topic:hover {
      color: var(--text);
      opacity: 1;
      background: var(--border);
    }

    .topic.active {
      color: var(--bg);
      background: var(--text);
    }

    .topic-header {
      margin-bottom: 48px;
    }

    .topic-name {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    .topic-count {
      font-size: 13px;
      color: var(--text-mute);
    }

    .topic-empty {
      padding: 20px 0;
      color: var(--text-mute);
      font-size: 14px;
    }

    /* Topic sections (home) */
    .topic-section {
      margin-bottom: 56px;
    }

    .topic-section:last-of-type {
      margin-bottom: 0;
    }

    .topic-section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 10px;
      margin-bottom: 4px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
    }

    .topic-section-header:hover {
      opacity: 1;
    }

    .topic-section-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.005em;
      color: var(--text);
      transition: opacity 0.15s ease;
    }

    .topic-section-meta {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 12px;
      color: var(--text-mute);
      font-variant-numeric: tabular-nums;
    }

    .topic-section-arrow {
      color: var(--text-mute);
      transition: transform 0.15s ease, color 0.15s ease;
    }

    .topic-section-header:hover .topic-section-name {
      opacity: 0.55;
    }

    .topic-section-header:hover .topic-section-arrow {
      color: var(--text);
      transform: translateX(3px);
    }

    .year {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--text-mute);
      margin-top: 48px;
      margin-bottom: 12px;
    }

    .year:first-of-type {
      margin-top: 0;
    }

    .post-item {
      display: flex;
      align-items: baseline;
      gap: 16px;
      padding: 9px 0;
    }

    .post-date {
      font-size: 13px;
      color: var(--text-mute);
      flex-shrink: 0;
      width: 56px;
      font-variant-numeric: tabular-nums;
    }

    .post-title {
      font-size: 15px;
      color: var(--text);
      flex: 1;
    }

    .post-reading-time {
      font-size: 12px;
      color: var(--text-mute);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .footer {
      margin-top: 96px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      margin-bottom: 16px;
    }

    .footer-links a {
      font-size: 14px;
      color: var(--text-soft);
    }

    .footer-links a:hover {
      color: var(--text);
      opacity: 1;
    }

    code {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.88em;
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--code-text);
    }

    pre {
      font-family: "JetBrains Mono", monospace;
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      padding: 16px 20px;
      border-radius: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 24px 0;
      font-size: 14px;
      line-height: 1.6;
    }

    pre code {
      background: none;
      padding: 0;
      border: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (max-width: 768px) {
      .container {
        padding: 56px 20px;
      }

      .header {
        margin-bottom: 56px;
      }

      .post-item {
        flex-wrap: wrap;
        gap: 4px 16px;
        padding: 12px 0;
      }

      .post-reading-time {
        width: 100%;
        margin-left: 72px;
        margin-top: -4px;
      }

      .footer {
        margin-top: 64px;
      }

      .footer-links {
        gap: 8px 20px;
      }

      .footer-links a {
        padding: 6px 0;
      }

      .post-title {
        padding: 2px 0;
      }

      pre {
        font-size: 13px;
        padding: 12px 16px;
        border-radius: 4px;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 32px 16px;
      }

      .post-date {
        width: 50px;
        font-size: 12px;
      }

      .post-title {
        font-size: 14px;
      }

      .post-reading-time {
        margin-left: 66px;
      }

      .header h1 {
        font-size: 16px;
      }

      .header p {
        font-size: 14px;
      }

      pre {
        font-size: 12px;
        padding: 10px 12px;
        margin: 16px -16px;
        border-radius: 0;
        border-left: none;
        border-right: none;
      }
    }
  </style>

</head>
<body>
  <div class="container">
    {{ content }}
  </div>
</body>
</html>
