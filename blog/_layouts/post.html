<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html }}{% else %}{{ site.description }}{% endif %}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:type" content="article">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.baseurl }}/feed.xml">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ site.baseurl }}/favicon.png">

  <!-- JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f6f6f6;
      --text: #1a1a1a;
      --text-soft: #444444;
      --text-mute: #7a7a7a;
      --text-faint: #b0b0b0;
      --border: #ececec;
      --border-soft: #f4f4f4;
      --link: #1a1a1a;
      --code-bg: #f6f6f6;
      --code-border: #e4e4e4;
      --code-text: #24292e;
      --quote-text: #555555;
      --quote-border: #d0d0d0;
      --toc-active: #1a1a1a;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0d;
        --bg-soft: #161616;
        --text: #d8d8d8;
        --text-soft: #b4b4b4;
        --text-mute: #888888;
        --text-faint: #5a5a5a;
        --border: #1f1f1f;
        --border-soft: #181818;
        --link: #d8d8d8;
        --code-bg: #161616;
        --code-border: #242424;
        --code-text: #d4d4d4;
        --quote-text: #a0a0a0;
        --quote-border: #2c2c2c;
        --toc-active: #e8e8e8;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(0, 0, 0, 0.05);
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 32px;
      -webkit-text-size-adjust: 100%;
      -moz-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
      font-size: 17px;
      line-height: 1.75;
      letter-spacing: -0.003em;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 88px 24px;
    }

    a {
      color: var(--link);
      transition: opacity 0.15s ease;
    }

    .back {
      display: inline-block;
      font-size: 14px;
      color: var(--text-mute);
      text-decoration: none;
      margin-bottom: 56px;
    }

    .back:hover {
      color: var(--text);
      opacity: 1;
    }

    .back .cursor {
      display: inline-block;
      width: 8px;
      height: 1em;
      background-color: var(--text-mute);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
    }

    .back:hover .cursor {
      background-color: var(--text);
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0;
      }
    }

    .post-layout {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 72px;
    }

    /* Table of Contents */
    .toc {
      position: sticky;
      top: 88px;
      align-self: start;
      max-height: calc(100vh - 176px);
      overflow-y: auto;
      padding-right: 8px;
    }

    .toc::-webkit-scrollbar {
      width: 4px;
    }

    .toc::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 2px;
    }

    .toc-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-faint);
      margin-bottom: 16px;
    }

    .toc-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .toc-list li {
      margin: 0;
    }

    .toc-list a {
      display: block;
      font-size: 13px;
      color: var(--text-mute);
      text-decoration: none;
      padding: 5px 0;
      border-left: 2px solid transparent;
      padding-left: 12px;
      margin-left: -12px;
      line-height: 1.45;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .toc-list a:hover {
      color: var(--text);
      opacity: 1;
    }

    .toc-list a.active {
      color: var(--toc-active);
      border-left-color: var(--toc-active);
    }

    .toc-list .toc-h3 a {
      padding-left: 24px;
      font-size: 12px;
      color: var(--text-faint);
    }

    /* Post Content */
    .post-article {
      max-width: 70ch;
    }

    .post-header {
      margin-bottom: 56px;
    }

    .post-series {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-mute);
      margin-bottom: 12px;
    }

    .post-title {
      font-size: 30px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.015em;
      margin-bottom: 14px;
      text-wrap: balance;
      color: var(--text);
    }

    .post-meta {
      font-size: 14px;
      color: var(--text-mute);
      font-variant-numeric: tabular-nums;
    }

    .post-meta span {
      margin-right: 16px;
    }

    .post-meta span:last-child {
      margin-right: 0;
    }

    .post-content {
      font-size: 17px;
      line-height: 1.75;
      color: var(--text-soft);
      letter-spacing: -0.003em;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .post-content > :first-child {
      margin-top: 0;
    }

    .post-content h2 {
      font-size: 21px;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.01em;
      margin-top: 56px;
      margin-bottom: 16px;
      color: var(--text);
      text-wrap: balance;
    }

    .post-content h3 {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.005em;
      margin-top: 40px;
      margin-bottom: 12px;
      color: var(--text);
      text-wrap: balance;
    }

    .post-content p {
      margin-bottom: 24px;
    }

    .post-content ul,
    .post-content ol {
      margin-bottom: 24px;
      padding-left: 24px;
    }

    .post-content li {
      margin-bottom: 8px;
    }

    .post-content li:last-child {
      margin-bottom: 0;
    }

    .post-content blockquote {
      border-left: 2px solid var(--quote-border);
      padding-left: 20px;
      margin: 32px 0;
      color: var(--quote-text);
      font-style: italic;
    }

    .post-content a {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      text-decoration-color: var(--text-faint);
      transition: text-decoration-color 0.15s ease;
    }

    .post-content a:hover {
      opacity: 1;
      text-decoration-color: var(--text);
    }

    /* Syntax Highlighting - Light Theme */
    .post-content code {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.85em;
      background: var(--code-bg);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--code-text);
    }

    .post-content pre {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      padding: 16px 20px;
      border-radius: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      margin: 32px 0;
      font-size: clamp(11px, 2.8vw, 14px);
      line-height: 1.65;
      max-width: 100%;
    }

    .post-content pre code {
      background: none;
      padding: 0;
      color: var(--code-text);
      border: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Syntax colors - GitHub Light */
    .highlight .k, .highlight .kd, .highlight .kn, .highlight .kp,
    .highlight .kr, .highlight .kt { color: #d73a49; }
    .highlight .s, .highlight .s1, .highlight .s2, .highlight .sb,
    .highlight .sc, .highlight .sd, .highlight .se, .highlight .sh,
    .highlight .sx { color: #032f62; }
    .highlight .c, .highlight .c1, .highlight .cm, .highlight .cp,
    .highlight .cs { color: #6a737d; font-style: italic; }
    .highlight .na, .highlight .nb, .highlight .nc, .highlight .no,
    .highlight .nd, .highlight .ni, .highlight .ne, .highlight .nf,
    .highlight .nl, .highlight .nn, .highlight .nt { color: #6f42c1; }
    .highlight .nv, .highlight .vc, .highlight .vg, .highlight .vi { color: #e36209; }
    .highlight .m, .highlight .mi, .highlight .mf, .highlight .mh,
    .highlight .mo { color: #005cc5; }
    .highlight .o, .highlight .ow { color: #d73a49; }
    .highlight .p { color: #24292e; }

    /* Syntax colors - GitHub Dark */
    @media (prefers-color-scheme: dark) {
      .highlight .k, .highlight .kd, .highlight .kn, .highlight .kp,
      .highlight .kr, .highlight .kt { color: #ff7b72; }
      .highlight .s, .highlight .s1, .highlight .s2, .highlight .sb,
      .highlight .sc, .highlight .sd, .highlight .se, .highlight .sh,
      .highlight .sx { color: #a5d6ff; }
      .highlight .c, .highlight .c1, .highlight .cm, .highlight .cp,
      .highlight .cs { color: #8b949e; font-style: italic; }
      .highlight .na, .highlight .nb, .highlight .nc, .highlight .no,
      .highlight .nd, .highlight .ni, .highlight .ne, .highlight .nf,
      .highlight .nl, .highlight .nn, .highlight .nt { color: #d2a8ff; }
      .highlight .nv, .highlight .vc, .highlight .vg, .highlight .vi { color: #ffa657; }
      .highlight .m, .highlight .mi, .highlight .mf, .highlight .mh,
      .highlight .mo { color: #79c0ff; }
      .highlight .o, .highlight .ow { color: #ff7b72; }
      .highlight .p { color: #d4d4d4; }
    }

    .post-content img {
      max-width: 100%;
      height: auto;
      margin: 32px 0;
      border-radius: 4px;
    }

    .post-content a {
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .post-content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 56px 0;
    }

    .post-content table {
      display: block;
      overflow-x: auto;
      white-space: nowrap;
      margin: 32px 0;
      border-collapse: collapse;
    }

    .post-content table th,
    .post-content table td {
      padding: 8px 16px;
      border: 1px solid var(--border);
      text-align: left;
    }

    .post-content table th {
      font-weight: 600;
      background: var(--code-bg);
    }

    .post-footer {
      margin-top: 80px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
    }

    .post-footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
    }

    .post-footer-links a {
      font-size: 14px;
      color: var(--text-mute);
      text-decoration: none;
    }

    .post-footer-links a:hover {
      color: var(--text);
      opacity: 1;
    }

    /* Mobile */
    @media (max-width: 900px) {
      .container {
        padding: 56px 20px;
      }

      .post-layout {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .toc {
        position: relative;
        top: 0;
        margin-bottom: 40px;
        padding: 18px 20px;
        background: var(--bg-soft);
        border-radius: 6px;
        max-height: none;
      }

      .toc-list a {
        padding-left: 0;
        margin-left: 0;
        border-left: none;
      }

      .toc-list .toc-h3 a {
        padding-left: 16px;
      }

      .post-title {
        font-size: 26px;
      }

      .back {
        margin-bottom: 40px;
      }

      .post-header {
        margin-bottom: 40px;
      }

      .post-footer {
        margin-top: 64px;
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 40px 16px;
      }

      .post-content {
        font-size: 16px;
      }

      .post-content pre {
        padding: 12px 16px;
        margin: 24px 0;
        border-radius: 4px;
      }

      .post-content code {
        font-size: 0.85em;
      }

      .post-content h2 {
        font-size: 19px;
        margin-top: 40px;
      }

      .post-content h3 {
        font-size: 17px;
        margin-top: 28px;
      }

      .post-content blockquote {
        padding-left: 16px;
        margin: 24px 0;
      }

      .post-content ul,
      .post-content ol {
        padding-left: 22px;
      }

      .post-content img {
        margin: 24px 0;
      }

      .post-title {
        font-size: 23px;
      }

      .toc {
        display: none;
      }

      .post-footer-links {
        gap: 8px 16px;
      }

      .post-footer-links a {
        padding: 6px 0;
      }

      .back {
        padding: 4px 0;
      }

      .post-meta span {
        margin-right: 12px;
      }
    }

    @media (max-width: 480px) {
      .container {
        padding: 24px 14px;
      }

      .post-content {
        font-size: 15.5px;
        line-height: 1.7;
      }

      .post-content pre {
        padding: 10px 12px;
        margin: 20px -14px;
        border-radius: 0;
        border-left: none;
        border-right: none;
      }

      .post-content p {
        margin-bottom: 20px;
      }

      .post-content h2 {
        font-size: 18px;
        margin-top: 32px;
        margin-bottom: 12px;
      }

      .post-content h3 {
        font-size: 16px;
        margin-top: 24px;
        margin-bottom: 10px;
      }

      .post-content ul,
      .post-content ol {
        padding-left: 18px;
        margin-bottom: 20px;
      }

      .post-content blockquote {
        padding-left: 12px;
        margin: 20px 0;
      }

      .post-content img {
        margin: 20px -14px;
        border-radius: 0;
      }

      .post-content table {
        margin: 20px -14px;
        font-size: 13px;
      }

      .post-title {
        font-size: 21px;
        line-height: 1.3;
      }

      .post-meta {
        font-size: 13px;
      }

      .post-meta span {
        margin-right: 8px;
      }

      .back {
        font-size: 13px;
        margin-bottom: 28px;
      }

      .post-header {
        margin-bottom: 28px;
      }

      .post-footer {
        margin-top: 48px;
        padding-top: 24px;
      }

      .post-footer-links {
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a class="back" href="{{ site.baseurl }}/">← {{ site.title }}<span class="cursor"></span></a>

    <div class="post-layout">
      <nav class="toc" id="toc"></nav>

      <article class="post-article">
        <header class="post-header">
          {% if page.series %}<div class="post-series">{{ page.series }}</div>{% endif %}
          <h1 class="post-title">{{ page.title }}</h1>
          <div class="post-meta">
            <span>{{ page.date | date: "%B %d, %Y" }}</span>
            {% if page.reading_time %}<span>{{ page.reading_time }} min read</span>{% endif %}
          </div>
        </header>

        <div class="post-content" id="post-content">
          {{ content }}
        </div>

        <footer class="post-footer">
          <div class="post-footer-links">
            {% if site.social.github %}<a href="https://github.com/{{ site.social.github }}" target="_blank" rel="noopener">GitHub</a>{% endif %}
            <a href="{{ site.baseurl }}/feed.xml">RSS</a>
          </div>
        </footer>
      </article>
    </div>
  </div>

  <script>
    (function() {
      const content = document.getElementById('post-content');
      const toc = document.getElementById('toc');
      const headings = content.querySelectorAll('h2, h3');

      if (headings.length < 2) {
        toc.style.display = 'none';
        toc.closest('.post-layout').style.gridTemplateColumns = '1fr';
        return;
      }

      let html = '<div class="toc-title">On this page</div><ul class="toc-list">';

      const slugMap = {};
      headings.forEach((heading, i) => {
        let id = heading.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        if (slugMap[id] !== undefined) {
          slugMap[id]++;
          id = id + '-' + slugMap[id];
        } else {
          slugMap[id] = 0;
        }
        heading.id = id;
        const level = heading.tagName.toLowerCase();
        html += '<li class="toc-' + level + '"><a href="#' + id + '">' + heading.textContent + '</a></li>';
      });

      html += '</ul>';
      toc.innerHTML = html;

      // Highlight active section on scroll
      const tocLinks = toc.querySelectorAll('a');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            tocLinks.forEach(link => link.classList.remove('active'));
            const activeLink = toc.querySelector('a[href="#' + entry.target.id + '"]');
            if (activeLink) activeLink.classList.add('active');
          }
        });
      }, { rootMargin: '-88px 0px -75% 0px' });

      headings.forEach(heading => observer.observe(heading));
    })();
  </script>
</body>
</html>
