---
layout: default
---

<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="{{ site.baseurl }}/" aria-label="{{ site.title }}">
      {% include brand-mark.svg %}
    </a>

    <nav class="site-nav" aria-label="Primary">
      <a class="sidebar-link" href="{{ site.baseurl }}/">Writing</a>
      <a class="sidebar-link{% if page.url == '/about/' %} active{% endif %}" href="{{ site.baseurl }}/about/">About</a>
    </nav>
  </aside>

  <main class="content">
    <div class="nameplate">{{ site.title }}</div>
    {{ content }}

    <footer class="content-footer">
      <div>&copy; 2026 {{ site.author.name }}.</div>
      <div class="footer-links">
        <a class="footer-link" href="https://github.com/grandimam" target="_blank" rel="noopener">GitHub</a>
        <a class="footer-link" href="https://twitter.com/thegrandimam" target="_blank" rel="noopener">Twitter</a>
        <a class="footer-link" href="{{ site.baseurl }}/feed.xml">RSS</a>
      </div>
    </footer>
  </main>
</div>
