# Site settings
title: Grandimam
description: "Building Karak to own and understand the HTTP request path, from connection to response. Notes on software, systems, and the decisions behind them."
baseurl: ""
url: "https://grandimam.com"

# Author
author:
  name: Grandimam

# Social
social:
  github: grandimam

# Build settings
markdown: kramdown
highlighter: rouge
future: true
permalink: /posts/:slug/
paginate: 10
paginate_path: "/page:num/"

# Collections
collections:
  posts:
    output: true
    permalink: /posts/:slug/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Topics
topics:
  - name: projects
    title: Projects
  - name: opinions
    title: Opinion Pieces

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
