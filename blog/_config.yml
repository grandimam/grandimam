# Site settings
title: Engineering Autonomous Systems
tagline: "From Outcomes to Systems."
# Handle shown in the site header.
handle: grandimam
description: "Starting with desired outcomes and building what they require, from language features and frameworks to autonomous systems."
baseurl: ""
url: "https://grandimam.com"
lang: en_US

# Author
author:
  name: Fauzan Baig
  bio: "Software engineer working backward from desired outcomes, exploring systems through first principles, experimentation, and building from scratch."
  url: "https://grandimam.com"

# Social (used by templates and jekyll-seo-tag)
social:
  name: Fauzan Baig
  github: grandimam
  twitter: grandimam_
  links:
    - https://github.com/grandimam
    - https://twitter.com/grandimam_
# Social links shown under the name in the site header, in this order.
social_links:
  - name: X
    url: https://twitter.com/grandimam_
  - name: GitHub
    url: https://github.com/grandimam
  - name: RSS
    url: /feed.xml
twitter:
  username: grandimam_
  card: summary

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  auto_ids: true
  syntax_highlighter: rouge
# Posts dated in the future are not published until that date (scheduling).
future: false
# Reading speed used for computed reading time.
words_per_minute: 230
# Posts longer than this get a table of contents (or set `toc: true`).
toc_min_words: 1200

# Every post gets its URL from its filename: _posts/2026-10-10-my-post.md -> /posts/my-post/
# Notes live in notes/_posts/ and are published at /notes/<name>/.
permalink: /posts/:slug/

# Defaults: new posts only need `title` and `topic`.
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      kind: "essay"
  - scope:
      path: "notes"
      type: "posts"
    values:
      layout: "post"
      kind: "note"
      permalink: /notes/:slug/
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Topics. Use one per post (`topic: python`). Topics with no posts are hidden.
topics:
  - name: python
    title: Python
    description: "Servers, frameworks, concurrency, and free-threaded Python."
  - name: agentic
    title: Agentic Engineering
    description: "Working with AI coding tools in practice: costs, limits, and workflows."
  - name: careers
    title: Careers
    description: "Hiring, evaluation, and how the market prices engineering work."
  - name: islam
    title: Islam
    description: "Notes on faith and practice."

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - Makefile
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - scripts/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
