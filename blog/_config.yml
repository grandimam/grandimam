# Site settings
title: grandimam
description: Writing on Python, concurrency, engineering, and faith.
baseurl: ""
url: "https://blog.grandimam.com"

# Author
author:
  name: Grandimam

# Social
social:
  github: grandimam

# Build settings
markdown: kramdown
highlighter: rouge
future: true
permalink: /posts/:slug/
paginate: 10
paginate_path: "/page:num/"

# Collections
collections:
  posts:
    output: true
    permalink: /posts/:slug/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Topics
topics:
  - name: python
    title: Python
  - name: essays
    title: Essays
  - name: islam
    title: Islam

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
