# Site settings
title: Grandimam
description: Python, async, and the GIL-free future
baseurl: ""
url: "https://blog.grandimam.com"

# Author
author:
  name: Grandimam
  twitter: thegrandimam

# Social
social:
  twitter: thegrandimam
  github: grandimam

# Build settings
markdown: kramdown
highlighter: rouge
future: true
permalink: /posts/:slug/
paginate: 10
paginate_path: "/page:num/"

# Collections
collections:
  posts:
    output: true
    permalink: /posts/:slug/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Navigation (blog-only)
navigation:
  - title: posts
    url: /

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
