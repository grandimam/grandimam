{% if include.posts.size == 0 %}
  <p class="empty">Nothing here yet.</p>
{% else %}
  <ol class="row-list">
    {% for post in include.posts %}
      <li class="row-item">
        <a class="row-link" href="{{ post.url | relative_url }}">
          <span class="row-title">{{ post.title }}</span>
          <time class="row-meta" datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %Y" }}</time>
        </a>
      </li>
    {% endfor %}
  </ol>
{% endif %}
