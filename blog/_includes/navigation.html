{% assign posts_active = false %}
{% if page.url == '/' or page.layout == 'post' or page.layout == 'topic' %}
  {% assign posts_active = true %}
{% endif %}
<nav class="site-nav" aria-label="Primary">
  <a class="nav-link{% if posts_active %} active{% endif %}" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Posts</a>
  <a class="nav-link{% if page.url == '/about/' %} active{% endif %}" href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
  <a class="nav-link{% if page.url == '/framework/' %} active{% endif %}" href="{{ '/framework/' | relative_url }}"{% if page.url == '/framework/' %} aria-current="page"{% endif %}>Framework</a>
</nav>
